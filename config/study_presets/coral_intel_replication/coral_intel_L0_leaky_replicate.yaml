# ======================================================================
# Train Model recipe (VEGA preset format): "Coral Intel replicate, split after augmenting"
#
# The A0 replicate's settings exactly (YOLOv8x, 640 px, batch 16, seed 32,
# 300 epochs, Ultralytics default online augmentation), trained on
# coral_intel_t2aug_leaky: every photograph augmented, then split image by
# image, so copies of one photograph can sit in training and in test. Built
# from config/augment_presets/coral_intel_table2_leaky.yaml.
#
# One change from A0 besides the data: device "0", a single RTX 5090 with
# the whole batch of 16 on it (Lauren, 2026-09-28), as the paper trained on
# one RTX 5070 Ti. A0 split the batch across two cards.
#
# Purpose: measure whether that overlap reproduces the paper's published
# scores (test mAP50 0.938). Run in its own VEGA project, after the four-arm
# study, by scripts/_ablation/coral_intel_vega_driver.py --study leaky.
# Its test score is measured on its own leaky test split and is not a
# like-for-like comparison with A0 to B3.
# ======================================================================

_meta:
  name: "Coral Intel replicate, split after augmenting"
  description: "A0 settings on one GPU, trained on the dataset split after augmenting, so copies of test photos can sit in training."
  why: "Tests whether the paper's high scores come from copies of test photos sitting in training: the replicate's settings on data split after augmenting."
  task: detect
  study: coral_intel_replication
  arm: L0_leaky_replicate
  factor: "none"
  dataset: coral_intel_t2aug_leaky
  changes_from_replicate: []

params:
  # Core training
  model: "yolov8x.pt"
  model_path: ""
  epochs: 300
  imgsz: 640
  batch: 16
  patience: 100
  device: "0"   # one GPU, as the paper (Lauren, 2026-09-28); A0 used both
  valid_ratio: 0.15
  test_ratio: 0.15
  task: "detect"
  seed: 32

  # Schedule and optimizer (Ultralytics defaults)
  optimizer: "auto"
  cos_lr: false
  close_mosaic: 10
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0

  # Loss weights (Ultralytics defaults)
  box: 7.5
  cls: 0.5
  dfl: 1.5
  label_smoothing: 0.0

  # Online augmentation (Ultralytics defaults unless marked)
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  bgr: 0.0
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0

  # Carried for a complete record (no effect on a box detector)
  copy_paste_mode: "flip"
  erasing: 0.4
  auto_augment: "randaugment"
