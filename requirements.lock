# Generated 2026-08-26 (AST) on the primary Bizon box from:
#   env/bin/python -m pip freeze        (Python 3.11.15, pip 26.0.1)
#
# Install with: bash scripts/setup_unified_env.sh          (locked mode, default)
# or manually:  pip install -r requirements.lock
#               pip install -e scripts/TCRMPtrain_oceankindCV/ultralytics_src --no-deps
#
# torch / CUDA variant note:
#   torch==2.11.0 and torchvision==0.26.0 from plain PyPI ARE the CUDA 13.0
#   builds (torch.version.cuda == "13.0"; deps nvidia-*-cu13 match this file).
#   No special --index-url is needed. This supersedes the setup script's old
#   cu128 special-index path: the live env drifted to cu130 and cu130 is what
#   works on this box (Blackwell RTX 5090), so cu130 is what is locked.
#
# ultralytics note:
#   ultralytics is NOT pinned here because it is an editable PATH install of
#   the vendored fork at scripts/TCRMPtrain_oceankindCV/ultralytics_src
#   (AGPL-3.0). pip freeze renders it as a git+https line that does not
#   reproduce a local editable checkout, so the setup script performs
#   `pip install -e <path> --no-deps` after this file; every ultralytics
#   runtime dependency is already pinned below (ultralytics-thop included).
