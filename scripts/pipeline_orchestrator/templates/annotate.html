<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Annotate Images</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap">
<style>
  body{margin:0;font-family:'Inter',ui-sans-serif,-apple-system,sans-serif;background:#0a0a0f;color:#F5EDF0;display:flex;align-items:center;justify-content:center;height:100vh}
  .card{text-align:center;max-width:460px;padding:24px;background:#11111a;border:1px solid #2a2a38;border-radius:3px}
  #title{font-size:15px;font-family:'Syne','Space Grotesk',sans-serif;font-weight:700}#msg{margin-top:10px;font-size:12px;color:#b0a7ab;line-height:1.5}
  .bar{margin-top:14px;height:6px;border-radius:2px;background:#1d1d26;overflow:hidden}
  #fill{height:100%;width:0%;background:#E20074;transition:width .3s}
  #err{margin-top:12px;color:#FF4D6D;font-size:12px;display:none}
  button{margin-top:14px;background:transparent;color:#F5EDF0;border:1px solid #2a2a38;border-radius:2px;font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;cursor:pointer;display:none}
  button:hover{border-color:#E20074;color:#FFB3D9}
</style>
<link rel="stylesheet" href="/static/vega_tour.css?v={{ asset_version }}">
</head><body>
<div class="card">
  <div id="title">Annotate Images</div>
  <div id="msg">Starting the annotator. A cold SAM3 load takes about a minute; this page opens it automatically.</div>
  <div class="bar"><div id="fill"></div></div>
  <div id="err"></div>
  <button id="retry" title="Try starting the annotator again.">Retry</button>
</div>
<script>
const $ = id => document.getElementById(id);
// The initials VICARIUS passed as ?initials=XX (two to four letters), handed
// on to the annotator; anything else is dropped.
function passedInitials() {
  try {
    const raw = new URLSearchParams(window.location.search).getAll('initials');
    const v = String(raw.length === 1 ? raw[0] : '').trim().toUpperCase();
    return /^[A-Z]{2,4}$/.test(v) ? v : '';
  } catch (e) { return ''; }
}
async function start() {
  $('err').style.display = 'none'; $('retry').style.display = 'none'; $('fill').style.width = '5%';
  let r;
  try { r = await (await fetch('/api/annotate/run', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'})).json(); }
  catch (e) { return fail('Could not start: ' + e); }
  if (!r.success) return fail(r.error || 'Could not start');
  const port = r.ui_port; let n = 0;
  const tick = async () => {
    n++; $('fill').style.width = Math.min(95, 5 + n * 1.5) + '%';
    try {
      const s = await (await fetch('/api/annotate/status')).json();
      if (s.healthy) { $('fill').style.width = '100%'; const who = passedInitials(); window.location.href = 'http://' + location.hostname + ':' + port + '/?orchestrated=1' + (who ? '&initials=' + who : ''); return; }
      if (s.running === false && n > 4) return fail('The annotator exited before it became ready. Check the service log.');
    } catch (e) {}
    if (n > 240) return fail('The annotator did not become ready in time.');
    setTimeout(tick, 1000);
  };
  tick();
}
function fail(m) { $('err').textContent = m; $('err').style.display = 'block'; $('retry').style.display = 'inline-block'; }
$('retry').onclick = start;
start();
</script>
<script src="/static/vega_tour_content.js?v={{ asset_version }}"></script>
<script src="/static/vega_tour.js?v={{ asset_version }}"></script>
</body></html>
